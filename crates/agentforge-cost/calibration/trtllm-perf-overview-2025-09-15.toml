# Published TensorRT-LLM max-throughput rows used to calibrate the cost model.
# Source: https://nvidia.github.io/TensorRT-LLM/performance/perf-overview.html, page dated
# 2025-09-15 (commit 0c9430e), read 2026-11-21. Metric: total output tokens per second with
# requests submitted at an infinite rate to trtllm-bench (PyTorch backend), i.e. offline maximum
# throughput; the page states no concurrency. The rows are FP8 on H100 and H200 at TP 2 and FP4
# on B200 at TP 1, 33 in all. The models are NVIDIA's Llama 3.3 70B Instruct FP8 and FP4
# checkpoints; Llama 3.3 70B has the Llama 3.1 70B architecture (80 layers, 8192 wide, 64 heads,
# 8 KV heads, 28672 FFN), so the `llama-3.1-70b` preset describes it. The FP8 and NVFP4 Model
# Optimizer checkpoints quantize the KV cache to FP8 (assumption, from the checkpoints'
# hf_quant_config kv_cache_quant_algo; not stated on the page).
name = "trtllm-perf-overview-2025-09-15"
source = "https://nvidia.github.io/TensorRT-LLM/performance/perf-overview.html"
retrieved = "2026-11-21"
metric = "total output tokens per second, offline, infinite request rate, trtllm-bench PyTorch backend"

# Llama 3.3 70B Instruct FP8 on H200 SXM 141GB (DGX H200), TP 2.
[[rows]]
machine = "h200"
model = "llama-3.1-70b"
weight_precision = "fp8"
kv_precision = "fp8"
tp = 2
isl = 128
osl = 128
tokens_per_s = 6327.98

